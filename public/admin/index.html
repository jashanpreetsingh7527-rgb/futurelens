<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview &middot; FUTURELENS admin</title>
<link rel="icon" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body data-page="dashboard">

<div class="mobile-bar">
  <button id="sideToggle" aria-label="Open menu">Menu</button>
  <b>FUTURELENS</b>
</div>

<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="work">
    <div class="page-head">
      <div>
        <h1 id="pageTitle">Overview</h1>
        <p id="pageSub"><span id="greeting"></span></p>
      </div>
      
    </div>
    <div id="pageNotice"></div>
    <div class="tiles" id="tiles"></div>
    <section>
      <div class="page-head" style="margin-bottom:0;border-bottom:0"><h1 style="font-size:1.3rem">Recent activity</h1></div>
      <div class="panel"><ul class="log" id="recent"></ul></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<section class="drawer" id="drawer" aria-hidden="true">
  <header><h2 id="drawerTitle">Edit</h2><button class="close" id="drawerClose" aria-label="Close">&times;</button></header>
  <div class="body" id="drawerBody"></div>
  <footer>
    <button class="btn quiet" id="drawerCancel" type="button">Cancel</button>
    <button class="btn" id="drawerSave" type="button">Save</button>
  </footer>
</section>

<script src="/assets/js/admin.js"></script>
</body>
</html>

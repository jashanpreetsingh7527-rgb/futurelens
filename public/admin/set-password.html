<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set your password &middot; FUTURELENS</title>
<link rel="icon" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="auth-page" data-page="set-password">
  <div class="auth-card">
    <div class="crest">
      <img src="/assets/img/light-icon.png" alt="">
      <span class="words"><b>FUTURELENS</b><span class="slogan">SEE THE FUTURE! SHAPE THE FUTURE!</span></span>
    </div>
    <h1>Set your password</h1>
    <p class="sub">Choose the password you will use to sign in. Nobody else ever sees it.</p>
    <div id="setNotice"></div>
    <form id="setForm" hidden>
      <p class="hint" style="margin-bottom:1rem"><strong id="who"></strong></p>
      <div class="field">
        <label for="password">New password</label>
        <input id="password" type="password" required autocomplete="new-password">
        <p class="hint">At least 10 characters, with an uppercase letter, a lowercase letter and a number.</p>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" required autocomplete="new-password">
      </div>
      <button class="btn" type="submit" style="width:100%">Set password and continue</button>
    </form>
  </div>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
